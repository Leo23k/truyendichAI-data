name: Generate TTS audio

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/generate_tts.py"
      - ".github/workflows/tts.yml"
  workflow_dispatch:
    inputs:
      voice:
        description: Vietnamese voice to generate
        required: true
        default: vi-VN-HoaiMyNeural
        type: choice
        options:
          - vi-VN-HoaiMyNeural
          - vi-VN-NamMinhNeural
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - id: credentials
        name: Check data repository token
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: echo "ready=$([ -n \"$DATA_REPO_TOKEN\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Skip until DATA_REPO_TOKEN is configured
        if: steps.credentials.outputs.ready != 'true'
        run: echo "DATA_REPO_TOKEN is required to commit generated audio."

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Install Edge TTS
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Generate missing MP3 files
        if: steps.credentials.outputs.ready == 'true'
        env:
          TTS_VOICE: ${{ inputs.voice || 'vi-VN-HoaiMyNeural' }}
        run: python scripts/generate_tts.py --voice "$TTS_VOICE"

      - name: Commit generated audio once
        if: steps.credentials.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No TTS changes to commit."
            exit 0
          fi
          git commit -m "tts: generate chapter audio"
          git push origin HEAD:main
